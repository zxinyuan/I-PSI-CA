[package]
name = "i-psi-ca"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"

[dependencies]
serde      = { version = "1", features = ["derive"] }
bincode    = "1"
bulletproofs       = { version = "4", path = "vendor/pkc2019/bulletproofs", features = ["yoloproofs"] }
curve25519-dalek-ng = { version = "4", features = ["serde"] }
rand       = "0.8"
merlin     = "3"
zeroize    = { version = "1", features = ["derive"] }

# Exact protocol: library Sigma composition over the existing ng backend.
sigma_fun = { version = "0.8", default-features = false, features = ["serde"] }
sha2 = "0.10"
rand_chacha = "0.3"

# Native RLWE target encryption and complete Bulletproof evaluation constraints.
fhe = { version = "=0.1.0", optional = true }
fhe-traits = { version = "=0.1.0", optional = true }
fhe-math = { version = "=0.1.0", optional = true }
prost = { version = "0.14", optional = true }

rand09 = { package = "rand", version = "0.9", optional = true }

# Existing SHA-256 R1CS arithmetization; constraints are proved by Bulletproofs.
ark-ff = { version = "0.4", optional = true }
ark-relations = { version = "0.4", optional = true }
ark-r1cs-std = { version = "0.4", optional = true }
ark-crypto-primitives = { version = "0.4", features = ["r1cs", "crh"], optional = true }
num-bigint = { version = "0.4", optional = true }
num-traits = { version = "0.2", optional = true }
logproof = { path = "vendor/pkc2019/logproof", optional = true }
sunscreen_math = { path = "vendor/pkc2019/sunscreen_math", optional = true }
crypto-bigint = { version = "0.5", features = ["serde"], optional = true }

[features]
default = ["experimental-rlwe"]
experimental-rlwe = ["dep:fhe", "dep:fhe-traits", "dep:fhe-math", "dep:rand09", "dep:prost", "dep:ark-ff", "dep:ark-relations", "dep:ark-r1cs-std", "dep:ark-crypto-primitives", "dep:num-bigint", "dep:num-traits", "dep:logproof", "dep:sunscreen_math", "dep:crypto-bigint"]

# Whole-program optimization for the curve arithmetic; measured at up to 5%.
[profile.release]
lto = "fat"
codegen-units = 1
