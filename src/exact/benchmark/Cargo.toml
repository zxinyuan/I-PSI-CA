[package]
name = "exact-bench"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"

[dependencies]
i-psi-ca = { path = "../../..", default-features = false }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
bincode = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "sync", "time", "macros", "signal"] }
rand = "0.8"
libc = "0.2"
zeroize = "1"

[profile.release]
lto = "thin"
codegen-units = 1
